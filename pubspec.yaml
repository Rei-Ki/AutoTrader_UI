name: lotosui
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  path_provider: ^2.0.1
  
  fluttertoast: ^8.2.5
  liquid_pull_to_refresh: ^3.0.1

  firebase_core: ^2.24.2
  cloud_firestore: ^4.13.3

  flutter_bloc: ^8.1.3
  get_it: ^7.2.0
  intl: ^0.19.0
  google_nav_bar: ^5.0.6
  flutter_slidable: ^3.0.1
  timeline_tile: ^2.0.0
  avatar_glow: ^3.0.1

  talker_flutter: ^4.2.2
  talker_bloc_logger: ^4.2.2

  web_socket_channel: ^3.0.0 # канал соккетов
  card_swiper: ^3.0.1 # карточки

  flutter_toggle_tab: ^1.4.1 # красивые вкладки

  hive: ^2.2.3 # бд
  syncfusion_flutter_charts: ^25.2.5 # графики
  collection: ^1.18.0
  marquee: ^2.2.3 # для прокручиваемого текста

  # Обязательно попробовать
  toggle_switch: ^2.1.0
  load_switch: ^2.1.0
  # toggle_switch: ^2.3.0
  # animated_toggle_switch: ^0.8.2


dev_dependencies:
  flutter_test:
    sdk: flutter
    
  build_runner: ^2.4.10
  hive_generator: ^2.0.1

  flutter_lints: ^4.0.0
  launcher_name: ^1.0.2
  flutter_launcher_icons: ^0.13.1


launcher_name:
  default: "Auto Trader"


flutter_launcher_icons:
  remove_alpha_ios: true
  ios: true
  android: true
  image_path: "assets/traider_app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/traider_app_logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/traider_app_logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  # macos:
  #   generate: true
  #   image_path: "assets/trader_app_logo.png"


flutter:
  uses-material-design: true
  assets:
    - assets/

